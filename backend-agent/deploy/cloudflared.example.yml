# cloudflared 터널 설정 — 본을 뜨는 파일이다.
#
# 실제 파일은 여기가 아니라 cloudflared 가 읽는 자리에 둔다.
#   손으로 돌릴 때   %USERPROFILE%\.cloudflared\config.yml
#   서비스로 돌 때   C:\Windows\System32\config\systemprofile\.cloudflared\config.yml
#
# **서비스는 SYSTEM 계정으로 돌아서 홈 디렉터리가 다르다.** 손으로는 잘 되는데
# 서비스로 바꾸면 안 되는 사고가 거의 다 여기서 난다 (docs/배포.md 6단계).
#
# <> 안은 채워 넣는다. 터널 ID 는 `cloudflared tunnel list` 로 본다.

tunnel: <터널-ID>
credentials-file: C:\Users\<사용자>\.cloudflared\<터널-ID>.json

ingress:
  - hostname: <memoa.example.com>
    service: http://127.0.0.1:8010
    originRequest:
      # 서버가 잠깐 재기동 중이면 몇 초 기다렸다 붙는다.
      connectTimeout: 10s
      # service 가 http:// 라 TLS 설정은 필요 없다 — 같은 컴퓨터 안이다.
      #
      # 응답 시간은 따로 잡지 않는다. 가장 느린 경로가 전사 6초
      # (AZURE_STT_TIMEOUT)이고, Cloudflare 엣지의 상한(100초)이 그보다 한참
      # 길어서 우리 예산이 먼저 걸린다.

  # 위 hostname 이 아닌 요청은 여기서 끝난다. 이 줄이 없으면 cloudflared 가
  # 설정을 거부한다 — 마지막 규칙은 반드시 받는 곳 없는 service 여야 한다.
  - service: http_status:404
