<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" fill="none" role="img" aria-labelledby="book-title book-description">
  <title id="book-title">사진과 이야기가 담긴 자서전</title>
  <desc id="book-description">펼쳐진 크림색 책 위로 시골집 사진과 가족의 빛바랜 사진 두 장이 포개져 있습니다.</desc>
  <defs>
    <linearGradient id="landscape-wash" x1="337" y1="110" x2="325" y2="407" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5E4DA" stop-opacity=".7"/>
      <stop offset="1" stop-color="#F5E4DA" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="left-paper" x1="148" y1="225" x2="338" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFAF3"/>
      <stop offset=".67" stop-color="#F9F0E4"/>
      <stop offset="1" stop-color="#E5D6C1"/>
    </linearGradient>
    <linearGradient id="right-paper" x1="337" y1="317" x2="568" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DECEB9"/>
      <stop offset=".14" stop-color="#F8EEDF"/>
      <stop offset=".55" stop-color="#FFFAF3"/>
      <stop offset="1" stop-color="#F7ECDC"/>
    </linearGradient>
    <linearGradient id="page-edge" x1="320" y1="330" x2="325" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9DDCC"/>
      <stop offset="1" stop-color="#D1BDA6"/>
    </linearGradient>
    <linearGradient id="photo-paper" x1="3" y1="0" x2="160" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFAF3"/>
      <stop offset="1" stop-color="#F0E4D3"/>
    </linearGradient>
    <linearGradient id="house-sky" x1="85" y1="18" x2="85" y2="153" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8CCB7"/>
      <stop offset="1" stop-color="#BCAE91"/>
    </linearGradient>
    <linearGradient id="portrait-wall" x1="71" y1="17" x2="71" y2="147" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C2B295"/>
      <stop offset="1" stop-color="#A89578"/>
    </linearGradient>
    <radialGradient id="photo-vignette" cx=".5" cy=".38" r=".75">
      <stop offset=".35" stop-color="#796552" stop-opacity="0"/>
      <stop offset="1" stop-color="#514235" stop-opacity=".26"/>
    </radialGradient>
    <filter id="ground-shadow" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="photo-shadow" x="-25%" y="-20%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="2" dy="9" stdDeviation="10" flood-color="#796552" flood-opacity=".17"/>
    </filter>
    <filter id="book-shadow" x="-10%" y="-15%" width="130%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#796552" flood-opacity=".15"/>
    </filter>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="17" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 .47  0 0 0 0 .39  0 0 0 0 .31  0 0 0 .07 0" result="tinted-grain"/>
      <feComposite in="tinted-grain" in2="SourceAlpha" operator="in" result="masked-grain"/>
      <feBlend in="SourceGraphic" in2="masked-grain" mode="multiply"/>
    </filter>
    <clipPath id="house-window"><rect x="12" y="13" width="162" height="143" rx="1"/></clipPath>
    <clipPath id="portrait-window"><rect x="12" y="13" width="129" height="144" rx="1"/></clipPath>
    <clipPath id="left-page-clip"><path d="M77 246C149 219 227 210 291 221C308 224 322 234 332 248L338 380C321 365 304 357 286 355C218 349 156 351 94 335L77 246Z"/></clipPath>
    <clipPath id="right-page-clip"><path d="M332 248C347 230 363 220 385 219C439 216 500 229 551 248L574 333C507 345 433 355 366 367C354 369 346 374 338 380L332 248Z"/></clipPath>
  </defs>

